[project]
name = "shabbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "todoist-api-python>=2.0",
]

[project.optional-dependencies]
test = ["pytest", "ruff", "mypy"]

[project.scripts]
shabbot = "shabbot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
